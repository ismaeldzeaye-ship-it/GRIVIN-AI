<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#accent)" stroke-width="6" stroke-opacity="0.25"/>
  <!-- Candle wicks -->
  <line x1="180" y1="90" x2="180" y2="410" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <line x1="330" y1="130" x2="330" y2="390" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <!-- Candle bodies -->
  <rect x="150" y="160" width="60" height="170" rx="10" fill="#06b6d4"/>
  <rect x="300" y="210" width="60" height="120" rx="10" fill="#fbbf24"/>
  <!-- Trend / Signal line with institutional node -->
  <path d="M120 360 L210 260 L290 310 L400 170" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="170" r="16" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
  <!-- Institutional Badge G -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#94a3b8" text-anchor="middle" letter-spacing="4">GREVIN AI</text>
</svg>
